<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="description" content="Página não encontrada no portfólio de Samuel Mickael.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
    <script>
        /* Mesmo tema escolhido no portfólio (vermelho ou azul) */
        (function () {
            var azul = false;
            try { azul = localStorage.getItem("portfolio-tema") === "azul"; } catch (e) { /* sem armazenamento */ }
            document.documentElement.dataset.tema = azul ? "azul" : "vermelho";
            document.write('<link rel="stylesheet" id="folhaTema" href="' + (azul ? "style-azul.css" : "style.css") + '">');
        })();
    </script>
    <noscript><link rel="stylesheet" href="style.css"></noscript>
    <title>404 | Samuel Mickael</title>
    <style>
        .pagina-404 { min-height:90vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
        .pagina-404 .terminal-interativo { width:min(560px,100%); margin:0 0 28px; text-align:left; animation:none; }
        .pagina-404 .terminal-corpo p { color:var(--text); }
        .pagina-404 .terminal-corpo p.erro-404 { color:var(--acento-texto); }
        .pagina-404 h1 { font-size:clamp(2.2rem,7vw,3.4rem); margin-bottom:10px; letter-spacing:-.04em; }
        .pagina-404 p.desc { color:var(--muted); max-width:420px; margin:0 auto 28px; }
        .botao-tema-404 { position:fixed; top:20px; right:20px; }
        @media (prefers-reduced-motion: no-preference) {
            .pagina-404 h1, .pagina-404 p.desc, .pagina-404 > a.botao { opacity: 0; animation: entrada-404 .5s ease forwards; }
            .pagina-404 h1 { animation-delay: .1s; }
            .pagina-404 p.desc { animation-delay: .2s; }
            .pagina-404 > a.botao { animation-delay: .3s; }
            @keyframes entrada-404 { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        }
    </style>
</head>
<body>
    <button id="botaoTema" class="botao-som botao-tema botao-tema-404" type="button" aria-label="Trocar para o tema azul" title="Tema azul">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><path class="tema-metade" d="M12 4a8 8 0 0 1 0 16z"/></svg>
    </button>
    <div class="pagina-404">
        <div class="terminal-interativo" aria-hidden="true">
            <div class="terminal-topo"><i></i><i></i><i></i><span class="terminal-titulo">samuel@portfolio:~</span></div>
            <div class="terminal-corpo">
                <p><span class="terminal-prompt">$</span> cd <span id="rotaPedida">/rota-que-voce-tentou</span></p>
                <p class="erro-404">bash: cd: rota não encontrada (erro 404)</p>
                <p class="terminal-cursor">$ <span></span></p>
            </div>
        </div>
        <h1>Essa página não existe.</h1>
        <p class="desc">O link que você seguiu não existe (ou foi movido). Que tal voltar pro início?</p>
        <a class="botao botao-principal" href="/portfolio/">Voltar ao portfólio</a>
    </div>
    <script>
        const botaoTema = document.getElementById("botaoTema");
        function rotularTema() {
            const azul = document.documentElement.dataset.tema === "azul";
            botaoTema.setAttribute("aria-label", azul ? "Trocar para o tema vermelho" : "Trocar para o tema azul");
            botaoTema.title = azul ? "Tema vermelho" : "Tema azul";
        }
        rotularTema();
        botaoTema.addEventListener("click", () => {
            const atual = document.getElementById("folhaTema");
            const azul = document.documentElement.dataset.tema !== "azul";
            const nova = document.createElement("link");
            nova.rel = "stylesheet";
            nova.href = azul ? "style-azul.css" : "style.css";
            nova.onload = () => {
                atual.remove(); nova.id = "folhaTema";
                document.documentElement.dataset.tema = azul ? "azul" : "vermelho";
                try { localStorage.setItem("portfolio-tema", azul ? "azul" : "vermelho"); } catch (e) { /* sem armazenamento */ }
                rotularTema();
            };
            atual.after(nova);
        });
        try {
            document.getElementById("rotaPedida").textContent = location.pathname || "/rota-que-voce-tentou";
        } catch { /* mantém o texto padrão */ }
    </script>
</body>
</html>
