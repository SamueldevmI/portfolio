<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <title>Página não encontrada | Samuel Mickael</title>
    <style>
        .pagina-404 { min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
        .pagina-404 p.eyebrow { margin-bottom:10px; }
        .pagina-404 h1 { font-size:clamp(3rem,10vw,6rem); margin-bottom:14px; }
        .pagina-404 p.desc { color:var(--muted); max-width:420px; margin-bottom:28px; }
    </style>
</head>
<body>
    <div class="pagina-404">
        <p class="eyebrow">404</p>
        <h1>Página não encontrada</h1>
        <p class="desc">O link que você seguiu não existe (ou foi movido). Que tal voltar pro início?</p>
        <a class="botao botao-principal" href="/portfolio/">Voltar ao portfólio</a>
    </div>
    <script>document.body.classList.toggle("dark-mode", localStorage.getItem("tema") === "escuro");</script>
</body>
</html>
