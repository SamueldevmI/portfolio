<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="description" content="Página não encontrada no portfólio de Samuel Mickael.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
    <script>
        /* Mesmo tema escolhido no portfólio (vermelho ou azul) */
        (function () {
            var azul = false;
            try { azul = localStorage.getItem("portfolio-tema") === "azul"; } catch (e) { /* sem armazenamento */ }
            document.documentElement.dataset.tema = azul ? "azul" : "vermelho";
            document.write('<link rel="stylesheet" id="folhaTema" href="' + (azul ? "style-azul.css" : "style.css") + '">');
        })();
    </script>
    <noscript><link rel="stylesheet" href="style.css"></noscript>
    <title>404 | Samuel Mickael</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap">
    <style>
        /* 404 de gibi: o vilão roubou a página */
        .pagina-404 { min-height: 92vh; display: grid; place-items: center; padding: 24px 16px; }
        .quadro-404 { position: relative; width: min(560px, 100%); padding: 26px 22px 24px; border: 4px solid #111111; border-radius: 6px; background: radial-gradient(circle, rgba(17,17,17,.14) 1.6px, transparent 2px) 0 0 / 12px 12px, #f3ead6; color: #111111; text-align: center; box-shadow: 9px 9px 0 #111111; transform: rotate(-.6deg); }
        .legenda-404 { position: absolute; top: -18px; left: 16px; margin: 0; padding: 5px 12px 3px; border: 3px solid #111111; background: #ffe14d; font: 400 1rem/1 "Bangers", Impact, sans-serif; letter-spacing: .06em; transform: rotate(-2deg); }
        .numero-404 { display: block; margin: 8px 0 0; color: #ff2a3d; font: 400 clamp(5rem, 24vw, 8.5rem)/.9 "Bangers", Impact, sans-serif; letter-spacing: .04em; -webkit-text-stroke: 3px #111111; paint-order: stroke fill; text-shadow: 6px 6px 0 #111111; }
        .vilao-404 { display: block; width: 120px; height: 90px; margin: 4px auto 6px; }
        .quadro-404 h1 { margin: 0 0 8px; color: #111111; font: 400 clamp(1.9rem, 7vw, 2.6rem)/1 "Bangers", Impact, sans-serif; letter-spacing: .04em; text-transform: uppercase; }
        .quadro-404 p.desc { max-width: 400px; margin: 0 auto 20px; color: #2b2b2b; }
        .quadro-404 code { padding: 1px 6px; border: 1px solid #111111; background: #ffffff; font: .82rem "DM Mono", monospace; word-break: break-all; }
        .quadro-404 .botao-principal { border: 3px solid #111111; box-shadow: 4px 4px 0 #111111; font-weight: 700; }
        .rodape-404 { margin: 16px 0 0; font: .78rem "DM Mono", monospace; }
        .rodape-404 a { color: #c41f2a; }
        .botao-tema-404 { position: fixed; top: 20px; right: 20px; }
        @media (prefers-reduced-motion: no-preference) {
            .quadro-404 { animation: quadro-404 .45s cubic-bezier(.2, .9, .3, 1.2) both; }
            @keyframes quadro-404 { from { opacity: 0; transform: rotate(-6deg) scale(.85); } to { opacity: 1; transform: rotate(-.6deg) scale(1); } }
            .vilao-404 { animation: vilao-404 1.6s ease-in-out infinite alternate; }
            @keyframes vilao-404 { from { transform: translateX(-10px) rotate(-3deg); } to { transform: translateX(10px) rotate(3deg); } }
        }
    </style>
</head>
<body>
    <button id="botaoTema" class="botao-som botao-tema botao-tema-404" type="button" aria-label="Trocar para o tema azul" title="Tema azul">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><path class="tema-metade" d="M12 4a8 8 0 0 1 0 16z"/></svg>
    </button>
    <main class="pagina-404">
        <div class="quadro-404">
            <p class="legenda-404">Enquanto isso, no esconderijo…</p>
            <span class="numero-404" aria-hidden="true">404</span>
            <svg class="vilao-404" viewBox="0 0 120 90" aria-hidden="true"><path d="M20 70 Q60 20 100 70 Z" fill="#111111"/><circle cx="60" cy="40" r="22" fill="#111111"/><rect x="36" y="32" width="48" height="12" rx="6" fill="#ff2a3d"/><circle cx="50" cy="38" r="3" fill="#ffffff"/><circle cx="70" cy="38" r="3" fill="#ffffff"/><path d="M88 58 l22 -8 -4 22 z" fill="#ffffff" stroke="#111111" stroke-width="3"/><path d="M93 60 h10 M94 65 h8" stroke="#111111" stroke-width="2"/></svg>
            <h1>Ops! Essa página foi roubada pelo vilão.</h1>
            <p class="desc">Ele levou <code id="rotaPedida">/essa-pagina</code> e sumiu. Mas a edição completa continua lá no início.</p>
            <a class="botao botao-principal" href="/portfolio/">Voltar pro gibi →</a>
            <p class="rodape-404">ou <a href="/portfolio/#orcamento">pede um orçamento</a> · <a href="/portfolio/dicas/">dicas grátis</a></p>
        </div>
    </main>
    <script>
        const botaoTema = document.getElementById("botaoTema");
        function rotularTema() {
            const azul = document.documentElement.dataset.tema === "azul";
            botaoTema.setAttribute("aria-label", azul ? "Trocar para o tema vermelho" : "Trocar para o tema azul");
            botaoTema.title = azul ? "Tema vermelho" : "Tema azul";
        }
        rotularTema();
        botaoTema.addEventListener("click", () => {
            const atual = document.getElementById("folhaTema");
            const azul = document.documentElement.dataset.tema !== "azul";
            const nova = document.createElement("link");
            nova.rel = "stylesheet";
            nova.href = azul ? "style-azul.css" : "style.css";
            nova.onload = () => {
                atual.remove(); nova.id = "folhaTema";
                document.documentElement.dataset.tema = azul ? "azul" : "vermelho";
                try { localStorage.setItem("portfolio-tema", azul ? "azul" : "vermelho"); } catch (e) { /* sem armazenamento */ }
                rotularTema();
            };
            atual.after(nova);
        });
        try {
            document.getElementById("rotaPedida").textContent = location.pathname || "/rota-que-voce-tentou";
        } catch { /* mantém o texto padrão */ }
    </script>
</body>
</html>
