<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="description" content="Página não encontrada no portfólio de Samuel Mickael.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <title>404 | Samuel Mickael</title>
    <style>
        .pagina-404 { min-height:90vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
        .pagina-404 .terminal-interativo { width:min(560px,100%); margin:0 0 28px; text-align:left; animation:none; }
        .pagina-404 .terminal-corpo p { color:#8fe3c8; }
        .pagina-404 .terminal-corpo p.erro-404 { color:#ff6b6b; }
        .pagina-404 h1 { font-size:clamp(2.2rem,7vw,3.4rem); margin-bottom:10px; letter-spacing:-.04em; }
        .pagina-404 p.desc { color:var(--muted); max-width:420px; margin:0 auto 28px; }
        .botao-tema-404 { position:fixed; top:20px; right:20px; }
    </style>
</head>
<body>
    <button id="temaEscuro" class="switch botao-tema-404" type="button" aria-label="Ativar tema claro" aria-pressed="true">
        <span class="bola" aria-hidden="true">
            <svg class="icone-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg>
            <svg class="icone-lua" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        </span>
    </button>
    <div class="pagina-404">
        <div class="terminal-interativo" aria-hidden="true">
            <div class="terminal-topo"><i></i><i></i><i></i><span class="terminal-titulo">samuel@portfolio:~</span></div>
            <div class="terminal-corpo">
                <p><span class="terminal-prompt">$</span> cd <span id="rotaPedida">/rota-que-voce-tentou</span></p>
                <p class="erro-404">bash: cd: rota não encontrada (erro 404)</p>
                <p class="terminal-cursor">$ <span></span></p>
            </div>
        </div>
        <h1>Essa página não existe.</h1>
        <p class="desc">O link que você seguiu não existe (ou foi movido). Que tal voltar pro início?</p>
        <a class="botao botao-principal" href="/portfolio/">Voltar ao portfólio</a>
    </div>
    <script>
        const botaoTema404 = document.getElementById("temaEscuro");
        function atualizarTema404(escuro) {
            document.body.classList.toggle("dark-mode", escuro);
            document.documentElement.classList.toggle("dark-mode", escuro);
            botaoTema404.setAttribute("aria-pressed", String(!escuro));
            botaoTema404.setAttribute("aria-label", escuro ? "Ativar tema escuro" : "Ativar tema claro");
        }
        atualizarTema404(localStorage.getItem("tema") === "escuro");
        botaoTema404.addEventListener("click", () => {
            const escuro = !document.body.classList.contains("dark-mode");
            atualizarTema404(escuro);
            localStorage.setItem("tema", escuro ? "escuro" : "claro");
        });
        try {
            document.getElementById("rotaPedida").textContent = location.pathname || "/rota-que-voce-tentou";
        } catch { /* mantém o texto padrão */ }
    </script>
</body>
</html>
