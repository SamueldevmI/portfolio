name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  treino-planner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: treino-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v

  gastos-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gastos-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v
